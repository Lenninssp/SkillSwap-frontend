<div class="max-w-xl mx-auto my-16 px-6 py-10 bg-white border border-gray-200 rounded-2xl shadow-sm">
  <div class="text-center mb-10">
    <h1 class="text-3xl font-bold text-gray-900">Submit Your Review</h1>
    <p class="text-gray-500 mt-2">Share your experience working on this project.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #reviewForm="ngForm" class="space-y-8">
    <!-- Error Message -->
    <div *ngIf="error" class="p-4 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
      {{ error }}
    </div>

    <!-- Rating -->
    <div class="flex flex-col items-center gap-4">
      <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">How was your experience?</label>
      <div class="flex gap-2">
        <button 
          type="button"
          *ngFor="let star of [1,2,3,4,5]"
          (click)="setRating(star)"
          class="text-4xl transition-transform hover:scale-110 focus:outline-none"
          [ngClass]="reviewData.rating >= star ? 'text-yellow-400' : 'text-gray-200'"
        >
          ★
        </button>
      </div>
      <p class="text-sm font-bold text-gray-600">
        {{ reviewData.rating === 1 ? 'Poor' : 
           reviewData.rating === 2 ? 'Fair' : 
           reviewData.rating === 3 ? 'Good' : 
           reviewData.rating === 4 ? 'Very Good' : 'Excellent' }}
      </p>
    </div>

    <!-- Comment -->
    <div>
      <label for="comment" class="block text-sm font-semibold text-gray-700 mb-2">Detailed Feedback (Optional)</label>
      <textarea 
        id="comment" 
        name="comment"
        [(ngModel)]="reviewData.comment" 
        rows="5"
        placeholder="What did you like? What could be improved?"
        class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-4">
      <button 
        type="submit" 
        [disabled]="submitting"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-bold py-4 rounded-xl transition-colors shadow-sm cursor-pointer"
      >
        {{ submitting ? 'Submitting...' : 'Post Review' }}
      </button>
      <a 
        [routerLink]="['/jobs', jobId]" 
        class="text-center text-gray-500 font-semibold hover:text-gray-900 transition-colors"
      >
        Go Back
      </a>
    </div>
  </form>
</div>
