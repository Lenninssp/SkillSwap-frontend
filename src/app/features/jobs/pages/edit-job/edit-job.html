<div class="max-w-2xl mx-auto my-12 px-6 py-8 bg-white border border-gray-200 rounded-xl shadow-sm">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Edit Job Posting</h1>
    <p class="text-gray-500 mt-2">Update your project requirements.</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading()" class="text-center py-10">
    <p class="text-gray-500">Loading job data...</p>
  </div>

  <form *ngIf="!loading() && !error()" (ngSubmit)="onSubmit()" #jobForm="ngForm" class="space-y-6">
    <!-- Error Message -->
    <div *ngIf="error()" class="p-4 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
      {{ error() }}
    </div>

    <!-- Title -->
    <div>
      <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Job Title</label>
      <input 
        type="text" 
        id="title" 
        name="title"
        [(ngModel)]="jobData.title" 
        required
        placeholder="e.g. Build a Responsive Portfolio Website"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>

    <!-- Category -->
    <div>
      <label for="category" class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
      <select 
        id="category" 
        name="category"
        [(ngModel)]="jobData.category"
        required
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition-all"
      >
        <option value="" disabled>Select a category</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Budget -->
    <div>
      <label for="budget" class="block text-sm font-semibold text-gray-700 mb-1">Budget ($)</label>
      <input 
        type="number" 
        id="budget" 
        name="budget"
        [(ngModel)]="jobData.budget" 
        required
        min="1"
        placeholder="Enter your budget"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">Detailed Description</label>
      <textarea 
        id="description" 
        name="description"
        [(ngModel)]="jobData.description" 
        required
        rows="6"
        placeholder="Explain what needs to be done..."
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-4 pt-4">
      <button 
        type="submit" 
        [disabled]="!jobForm.form.valid || submitting()"
        class="flex-1 bg-gray-900 hover:bg-black disabled:bg-gray-400 text-white font-bold py-3 rounded-lg transition-colors shadow-sm cursor-pointer"
      >
        {{ submitting() ? 'Saving...' : 'Update Job' }}
      </button>
      <button 
        type="button"
        (click)="goBack()" 
        class="px-6 py-3 text-gray-600 font-semibold hover:text-gray-900 transition-colors cursor-pointer"
      >
        Cancel
      </button>
    </div>
  </form>

  <!-- Error View -->
  <div *ngIf="error() && !submitting()" class="text-center py-10">
     <p class="text-red-600 font-bold mb-4">{{ error() }}</p>
     <a routerLink="/jobs" class="text-blue-600 hover:underline font-bold">Back to Jobs</a>
  </div>
</div>
