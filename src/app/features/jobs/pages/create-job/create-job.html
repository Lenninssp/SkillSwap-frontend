<div class="max-w-2xl mx-auto my-12 px-6 py-8 bg-white border border-gray-200 rounded-xl shadow-sm">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Post a New Job</h1>
    <p class="text-gray-500 mt-2">Find the right freelancer for your project.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #jobForm="ngForm" class="space-y-6">
    <!-- Error Message -->
    <div *ngIf="error()" class="p-4 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
      {{ error() }}
    </div>

    <!-- Title -->
    <div>
      <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Job Title</label>
      <input 
        type="text" 
        id="title" 
        name="title"
        [ngModel]="jobData.title()" 
        (ngModelChange)="jobData.title.set($event)"
        required
        placeholder="e.g. Build a Responsive Portfolio Website"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>

    <!-- Category -->
    <div>
      <label for="category" class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
      <input 
        type="text" 
        id="category" 
        name="category"
        [ngModel]="jobData.category()" 
        (ngModelChange)="jobData.category.set($event)"
        required
        placeholder="e.g. Design, Development, Marketing"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition-all"
      >
    </div>

    <!-- Budget -->
    <div>
      <label for="budget" class="block text-sm font-semibold text-gray-700 mb-1">Budget ($)</label>
      <input 
        type="number" 
        id="budget" 
        name="budget"
        [ngModel]="jobData.budget()" 
        (ngModelChange)="jobData.budget.set($event)"
        required
        min="1"
        placeholder="Enter your budget"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">Detailed Description</label>
      <textarea 
        id="description" 
        name="description"
        [ngModel]="jobData.description()" 
        (ngModelChange)="jobData.description.set($event)"
        required
        rows="6"
        placeholder="Explain what needs to be done..."
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-4 pt-4">
      <button 
        type="submit" 
        [disabled]="!jobForm.form.valid || submitting()"
        class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-bold py-3 rounded-lg transition-colors shadow-sm cursor-pointer"
      >
        {{ submitting() ? 'Posting...' : 'Post Job Now' }}
      </button>
      <a 
        routerLink="/jobs" 
        class="px-6 py-3 text-gray-600 font-semibold hover:text-gray-900 transition-colors"
      >
        Cancel
      </a>
    </div>
  </form>
</div>
