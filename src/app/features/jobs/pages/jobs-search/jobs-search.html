<div class="max-w-5xl mx-auto my-8 px-4 font-sans text-gray-800">
  <h1 class="text-3xl font-bold text-center mb-8 text-gray-900">Browse Available Jobs</h1>

  <!-- Filters Section -->
  <section class="bg-gray-50 p-6 rounded-lg shadow-sm mb-8 flex flex-wrap gap-6 items-end border border-gray-100">
    <div class="flex flex-col gap-2 flex-1 min-w-[200px]">
      <label for="title" class="text-sm font-semibold text-gray-600">Search Title</label>
      <input 
        type="text" 
        id="title" 
        [ngModel]="filters.title()"
        (ngModelChange)="filters.title.set($event)"
        placeholder="e.g. Web Developer" 
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>

    <div class="flex flex-col gap-2 flex-1 min-w-[200px]">
      <label for="category" class="text-sm font-semibold text-gray-600">Category</label>
      <select 
        id="category" 
        [ngModel]="filters.category()"
        (ngModelChange)="filters.category.set($event)"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
        <option value="">All Categories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="flex flex-col gap-2 w-32">
      <label for="minBudget" class="text-sm font-semibold text-gray-600">Min Budget</label>
      <input 
        type="number" 
        id="minBudget" 
        [ngModel]="filters.minBudget()"
        (ngModelChange)="filters.minBudget.set($event)"
        placeholder="Min"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>

    <div class="flex flex-col gap-2 w-32">
      <label for="maxBudget" class="text-sm font-semibold text-gray-600">Max Budget</label>
      <input 
        type="number" 
        id="maxBudget" 
        [ngModel]="filters.maxBudget()"
        (ngModelChange)="filters.maxBudget.set($event)"
        placeholder="Max"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>
  </section>

  <hr class="mb-8 border-gray-200">

  <!-- Jobs List -->
  <div class="flex flex-col gap-6" *ngIf="filteredJobs().length > 0; else noJobs">
    <div *ngFor="let job of filteredJobs()" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
      
      <div>
        <div class="flex justify-between items-start mb-4">
          <h3 class="text-xl font-bold text-gray-900 line-clamp-1">{{ job.title }}</h3>
          <span [ngClass]="{
            'bg-green-50/50 text-green-600 border-green-100/50': job.status === jobStatus.OPEN,
            'bg-yellow-50/50 text-yellow-600 border-yellow-100/50': job.status === jobStatus.IN_PROGRESS,
            'bg-gray-50/50 text-gray-500 border-gray-100/50': job.status === jobStatus.COMPLETED
          }" class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest border">
            {{ job.status }}
          </span>
        </div>
        
        <p class="text-gray-600 leading-relaxed mb-6 line-clamp-3">
          {{ job.description }}
        </p>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-gray-50">
        <div class="flex flex-col">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">{{ job.category }}</span>
          <span class="text-lg font-bold text-green-600">
            ${{ job.budget }}
          </span>
        </div>
        <a 
          [routerLink]="['/jobs', job.id]" 
          class="inline-block border-2 border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white font-bold py-2 px-5 rounded-lg transition-all"
        >
          View Details
        </a>
      </div>
    </div>
  </div>

  <ng-template #noJobs>
    <div class="text-center py-16 text-gray-500">
      <p class="text-xl">No jobs found. Try adjusting your filters.</p>
    </div>
  </ng-template>
</div>
