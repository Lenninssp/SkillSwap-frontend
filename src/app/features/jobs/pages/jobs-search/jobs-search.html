<div class="max-w-5xl mx-auto my-8 px-4 font-sans text-gray-800">
  <h1 class="text-3xl font-bold text-center mb-8 text-gray-900">Browse Available Jobs</h1>

  <!-- Filters Section -->
  <section class="bg-gray-50 p-6 rounded-lg shadow-sm mb-8 flex flex-wrap gap-6 items-end border border-gray-100">
    <div class="flex flex-col gap-2 flex-1 min-w-[200px]">
      <label for="title" class="text-sm font-semibold text-gray-600">Search Title</label>
      <input 
        type="text" 
        id="title" 
        [(ngModel)]="filters.title" 
        placeholder="e.g. Web Developer" 
        (keyup.enter)="search()"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>

    <div class="flex flex-col gap-2 flex-1 min-w-[200px]">
      <label for="category" class="text-sm font-semibold text-gray-600">Category</label>
      <select 
        id="category" 
        [(ngModel)]="filters.category"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
        <option value="">All Categories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="flex flex-col gap-2 w-32">
      <label for="minBudget" class="text-sm font-semibold text-gray-600">Min Budget</label>
      <input 
        type="number" 
        id="minBudget" 
        [(ngModel)]="filters.minBudget" 
        placeholder="Min"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>

    <div class="flex flex-col gap-2 w-32">
      <label for="maxBudget" class="text-sm font-semibold text-gray-600">Max Budget</label>
      <input 
        type="number" 
        id="maxBudget" 
        [(ngModel)]="filters.maxBudget" 
        placeholder="Max"
        class="p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
      >
    </div>

    <button 
      (click)="search()" 
      class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-md transition-colors shadow-sm"
    >
      Search
    </button>
  </section>

  <hr class="mb-8 border-gray-200">

  <!-- Jobs List -->
  <div class="flex flex-col gap-6" *ngIf="jobs.length > 0; else noJobs">
    <div *ngFor="let job of jobs" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-xl font-bold text-gray-900">{{ job.title }}</h3>
        <span class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-gray-200">
          {{ job.category }}
        </span>
      </div>
      
      <p class="text-gray-600 leading-relaxed mb-6 line-clamp-3">
        {{ job.description }}
      </p>

      <div class="flex justify-between items-center pt-4 border-t border-gray-50">
        <span class="text-lg font-bold text-green-600">
          Budget: ${{ job.budget }}
        </span>
        <a 
          [routerLink]="['/jobs', job.id]" 
          class="inline-block border-2 border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white font-bold py-2 px-5 rounded-md transition-all"
        >
          View Details
        </a>
      </div>
    </div>
  </div>

  <ng-template #noJobs>
    <div class="text-center py-16 text-gray-500">
      <p class="text-xl">No jobs found. Try adjusting your filters.</p>
    </div>
  </ng-template>
</div>
